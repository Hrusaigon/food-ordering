<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="mobile-checkout.css">
</head>
<body>

  <div class="screen">

    <!-- Header -->
    <header class="header">
      <button type="button" class="icon-btn" aria-label="Go back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1>Checkout</h1>
      <button type="button" class="icon-btn icon-btn--round" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      </button>
    </header>

    <!-- Cart -->
    <main class="cart">

      <article class="product">
        <div class="product__content"></div>
        <div class="stepper">
          <button type="button" class="stepper__btn" aria-label="Increase quantity">+</button>
          <output class="stepper__qty">2</output>
          <button type="button" class="stepper__btn" aria-label="Decrease quantity">&minus;</button>
        </div>
      </article>

      <article class="product">
        <div class="product__content"></div>
        <div class="stepper">
          <button type="button" class="stepper__btn" aria-label="Increase quantity">+</button>
          <output class="stepper__qty">2</output>
          <button type="button" class="stepper__btn" aria-label="Decrease quantity">&minus;</button>
        </div>
      </article>

    </main>

    <!-- Order info sheet -->
    <section class="sheet" aria-labelledby="order-info">
      <h2 id="order-info">Order Info</h2>

      <dl class="rows">
        <div class="rows__item">
          <dt>Subtotal:</dt>
          <dd>$350</dd>
        </div>
        <div class="rows__item">
          <dt>Delivery fee:</dt>
          <dd>$10</dd>
        </div>
        <div class="rows__item">
          <dt>Discount:</dt>
          <dd>10%</dd>
        </div>
        <div class="rows__item rows__item--total">
          <dt>Total</dt>
          <dd>$324</dd>
        </div>
      </dl>

      <a href="/checkout" class="btn-pay">Place order</a>
    </section>

  </div>

</body>
</html>
